name: CI
on:
    pull_request:
    push:
        branches:
         - main
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: "22.13.1"
                check-latest: true
            - name: Install dependencies
              run: npm install
            - name: Run tests
              run: npm test
